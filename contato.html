<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rodrigo - Soluções em Informática</title>
  
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <img src="logo.jpeg" alt="Logo Rodrigo" class="logo">
    <h1 class="titulo">Rodrigo - Soluções em Informática 🖥️</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="trabalhos.html">Trabalhos</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="contato">
    <h2><i class="fab fa-whatsapp"></i> Fale com a gente</h2>
    <p>Envie sua mensagem direto para o WhatsApp preenchendo os campos abaixo:</p>

    <form id="form-contato">
      <label for="nome"><i class="fas fa-user"></i> Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email"><i class="fas fa-envelope"></i> E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="mensagem"><i class="fas fa-comment-dots"></i> Mensagem:</label>
      <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

      <button type="submit"><i class="fab fa-whatsapp"></i> Enviar via WhatsApp</button>
    </form>

    <div class="redes-sociais">
      <a href="https://wa.me/5511976817558" target="_blank" rel="noopener noreferrer" class="whatsapp-btn"><i class="fab fa-whatsapp"></i> WhatsApp</a>
      <a href="https://facebook.com/rodrigosolucoeseminformatica" target="_blank" rel="noopener noreferrer" class="facebook-btn"><i class="fab fa-facebook-f"></i> Facebook</a>
      <a href="https://instagram.com/rodrigosolucoeseminformatica" target="_blank" rel="noopener noreferrer" class="instagram-btn"><i class="fab fa-instagram"></i> Instagram</a>
    </div>
  </main>

  <footer>
    <p>#tecnologia #computadores #internet #notebooks #informática</p>
  </footer>

  <script>
    document.getElementById('form-contato').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const nome = encodeURIComponent(document.getElementById('nome').value);
      const email = encodeURIComponent(document.getElementById('email').value);
      const mensagem = encodeURIComponent(document.getElementById('mensagem').value);
      
      const numeroWhats = "5511976817558";
      
      const textoMensagem = `Olá, meu nome é ${nome}. Meu e-mail é ${email}.%0A%0AMensagem:%0A${mensagem}`;
      
      const url = `https://wa.me/${numeroWhats}?text=${textoMensagem}`;
      
      window.open(url, '_blank');
    });
  </script>
</body>
</html>
